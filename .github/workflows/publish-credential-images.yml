name: Publish Credential Provider Images

on:
  push:
    branches:
      - cred-provider-dev
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-credential-images-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/bahe-msft/cachew

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98 # pin@v6
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # pin@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # pin@v3.11.1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # pin@v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: cashapp/activate-hermit@e49f5cb4dd64ff0b0b659d1d8df499595451155a # pin@v1

      - name: Build Linux binaries
        run: |
          just build linux amd64
          just build linux arm64

      - name: Build and push Cachew
        uses: docker/build-push-action@8c1e8f8e5bf845ba3773a14f3967965548a2341e # pin@v6.18.0
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:cred-provider-dev
          labels: |
            org.opencontainers.image.source=https://github.com/bahe-msft/cachew
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=credential-provider-main
          cache-to: type=gha,mode=max,scope=credential-provider-main

      - name: Build and push credential test image
        uses: docker/build-push-action@8c1e8f8e5bf845ba3773a14f3967965548a2341e # pin@v6.18.0
        with:
          context: .
          file: ./docker/Dockerfile.test
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}:sha-${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:credential-test-sha-${{ github.sha }}
            ${{ env.IMAGE }}:credential-test
          labels: |
            org.opencontainers.image.source=https://github.com/bahe-msft/cachew
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=credential-provider-test
          cache-to: type=gha,mode=max,scope=credential-provider-test
